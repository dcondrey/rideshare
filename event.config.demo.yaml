# ───────────────────────────────────────────────────────────────────────────
#  Live-demo event. Loaded only when EVENT_CONFIG=event.config.demo.yaml
#  (render.demo.yaml sets it). The Internet Demo Workshop (IDW) is fictional:
#  a participant-driven demo unconference modeled on the Internet Identity
#  Workshop, centred on live demonstrations and cross-ecosystem
#  interoperability testing instead of standards talk. The dates are
#  placeholders; DEMO_MODE moves them to the coming weeks at boot so the
#  demo always shows an upcoming event (lib/demo.js).
# ───────────────────────────────────────────────────────────────────────────

